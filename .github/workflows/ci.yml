name: CI
on:
  push: { branches: ["**"] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # ★ 안 걸면 기본값이 6시간이다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci

      - name: 엔진 골든 벡터
        run: npm test

      - name: 타입
        run: npx tsc --noEmit -p tsconfig.json

      - name: 빌드
        run: npm run build

      # ★ 빌드 통과는 아무것도 보장하지 않는다 — 산출물을 직접 본다
      - name: 산출물 점검
        run: node gate/check-output.mjs

      - name: 조판·동작 실측 (Chromium)
        run: |
          npx playwright install --with-deps chromium
          node gate/check-render.mjs

      # ★ 플랫폼 잠금장치 — 세 lab 이 똑같이 답해야 하는 다섯 가지
      - name: 잠금장치 (우산으로 가는 길)
        run: node gate/check-lockup.mjs

      # ★ 다른 게이트는 전부 **도착 상태**만 잰다 — 값을 넣었을 때 무엇이 나오는지는
      #   따로 재야 한다(활성도 −5 가 −546.7 µSv/h 를 냈고 아무 게이트도 못 봤다)
      - name: 입력 방어 실측 (Chromium)
        run: node gate/check-inputs.mjs

      # ★ 다른 게이트는 「있는 것」을 잰다 — 이것은 **없는 것을 있다고 말하는지**를 잰다
      - name: 저장 기능의 말과 행동 (Chromium)
        run: node gate/check-save.mjs

      # ★ 다른 게이트는 전부 **스크롤 0 에서만** 잰다 — 스크롤한 뒤에만 존재하는 것은
      #   통째로 시야 밖이다. 역테스트 넷으로 확인했다(fixed 제거 · 관찰자 제거 ·
      #   처음부터 켬 · scroll-padding-top 제거).
      - name: 압축 고정 바 (Chromium)
        run: node gate/check-sticky.mjs

      # ★ 로그인 **상태별** 화면은 저장소를 채워야만 생긴다 — 다른 게이트는 전부
      #   로그아웃 상태만 본다. 역테스트 셋으로 확인했다(칩 제거 · 부팅 표식 제거 ·
      #   모바일 줄 배치 되돌림). 환경변수가 없는 빌드에서는 「표시가 없는 것」을 잰다.
      - name: 머리글 계정·테마 (Chromium)
        run: node gate/check-header.mjs

      # ★ 2026-09-16 소유주 지적 「radcalc 과 radimeter lab 화면 배경색 구성이 다르네 …
      #   상단메뉴는 동일한 배경, 폰트, 크기를 사용하면 좋겠어」. 원인은 색이 아니라
      #   **토큰 이름이 lab 마다 한 칸씩 밀린 것**이었다 — 이 lab 에는 `--c-paper` 가 없어
      #   `--c-surface` 가 본문을 맡았고, 그래서 같은 값 241,242,238 이 우산에서는 본문보다
      #   밝고 여기서는 어두웠다(채널합차 +25 대 −31 — 방향이 반대였다).
      # ★ check-header 의 「층 대비 18 이상」은 **상대값**이라 셋 다 통과하고 있었다.
      #   이 게이트는 **절대값**을 잰다. 역테스트 둘로 잡는 것을 확인했다.
      - name: 플랫폼 껍데기 정본 (Chromium)
        run: node gate/check-platform.mjs

      # ★★ 낱장 147장을 한꺼번에 늘리는 것이 그 작업의 유일한 진짜 위험이었다 —
      #   이웃 lab 이 애드센스에서 탈락한 원인이 「장 제목이 글자까지 같고 본문만 다른」 글
      #   묶음이었다. **어수 검사는 이것을 못 본다**(되풀이되는 설명으로 채워도 어수는 는다).
      #   실제로 첫 판이 어수는 넉넉한데 겹침이 중앙 20.8% 였다. 이 게이트가 겹침을 직접 잰다.
      # ★ 계산기 프리필이 **실제로 복원되는지** 브라우저로 눌러 확인한다 —
      #   처음에 `?n=Co-60` 으로 적었는데 그것을 읽는 코드가 아무 데도 없었다.
      #   역테스트 둘로 확인했다(설명 되돌림 → 27.8% · 죽은 링크 → 질의인자 결함).
      - name: 핵종 낱장 (Chromium)
        run: node gate/check-nuclides.mjs

      # ★ 커밋된 산출물은 반드시 낡는다 — 그림에 제목이 구워져 있다.
      #   역테스트: 도구 이름을 바꾸자 「제목이 바뀌었는데 그림이 그대로다」로 잡혔다.
      - name: 공유 이미지 대조
        run: node gate/check-og.mjs

      # ★★ 유효성 평가 — 「도구가 내는 답이 손계산과 같은가」를 **사람이 읽을 수 있는 형태**로
      #   내놓고, 그 자료가 도구를 실제로 덮고 있는지를 잰다. 셋을 본다 —
      #   ① 커버리지(도구가 단위를 늘리면 손계산도 늘어야 한다) ② 독립성(기대값이 엔진에서
      #   오면 대조가 순환이 된다) ③ **화면 실측**(사람이 보는 숫자까지).
      # ★ ③ 의 역테스트가 이 게이트의 존재 이유를 보여 준다: 환산표의 방향만 뒤집었더니
      #   **엔진 테스트 86건은 전건 통과**하고 화면 게이트가 282건을 잡았다.
      - name: 유효성 평가 (Chromium)
        run: npx tsx gate/check-validation.mjs
